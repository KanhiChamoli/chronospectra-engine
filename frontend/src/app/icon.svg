<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- rounded square outline, transparent fill -->
  <rect x="7" y="7" width="50" height="50" rx="15" stroke="#22d3ee" stroke-width="4"/>
  <!-- eye / comet body -->
  <path d="M18 30 C24 20 40 20 46 30 C40 40 24 40 18 30 Z" stroke="#22d3ee" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- pupil -->
  <circle cx="32" cy="30" r="5.5" fill="#22d3ee"/>
  <!-- orbit swoosh with arrowhead -->
  <path d="M18 34 C24 46 40 48 47 42" stroke="#22d3ee" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M47 42 l-6.5 -1.2 M47 42 l-2.2 6" stroke="#22d3ee" stroke-width="3.2" stroke-linecap="round"/>
</svg>
